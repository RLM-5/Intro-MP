<main class="qvn-main"><section class="qvn-page" data-page="p1"><div class="qvn-crumb">Ring Theory</div><details class="qv-sec" data-d="1" open id="grp-qbank-ring-theory"><summary>Ring Theory</summary><div class="qv-secbody"></div></details><details class="qv-sec" data-d="1" open id="grp-ringtheory-groupset1"><summary>Exercises before F2</summary><div class="qv-secbody"><ol class="qv-list"><li class="qv-q" id="groupset1-decide-which-of-following-rings-unital"><div class="qv-stmt" data-md="Decide which of the following rings are unital, division rings, or integral domains; find the units in the case of unital rings:

$$\mathbb{C},\ \mathbb{Z},\ \mathbb{Z}_n:=\mathbb{Z}/n\mathbb{Z},\ n\mathbb{Z},\ 2\mathbb{Z}/10\mathbb{Z},\ \mathbb{R}[x],\ \mathbb{R}[[x]]$$"></div></li><li class="qv-q" id="groupset1-direct-computations-to-check-you-comfortable"><div class="qv-stmt" data-md="Direct computations, to check that you are comfortable with the notation."></div><ol class="qv-sublist" type="a"><li class="qv-q" data-qid="groupset1-in-group-ring-where-langle-rangle" id="groupset1-in-group-ring-where-langle-rangle"><div class="qv-stmt" data-md="In the group ring $\mathbb{Z}C_3$, where $C_3=\langle g\rangle$ and $g^3=1$, compute
$(1+g)(1+g+g^2)$ and $(1-g)(1+g+g^2)$."></div></li><li class="qv-q" data-qid="groupset1-in-compute-2i-where-bi" id="groupset1-in-compute-2i-where-bi"><div class="qv-stmt" data-md="In $\mathbb{Z}_3[\phi]$, compute $(2+\phi)(1-2\phi)$, where $\phi$ is the golden ratio. Hint: it solves $\phi^2=\phi+1$."></div></li><li class="qv-q" data-qid="groupset1-in-15-find-multiplicative-inverse-of" id="groupset1-in-15-find-multiplicative-inverse-of"><div class="qv-stmt" data-md="In $\mathbb{Z}/15\mathbb{Z}$, find the multiplicative inverse of $\overline{8}$ (if it exists) and of $\overline{7}$ (if it exists)."></div></li><li class="qv-q" data-qid="groupset1-let-compute-overline-cdot-overline-overline" id="groupset1-let-compute-overline-cdot-overline-overline"><div class="qv-stmt" data-md="Let $R=\mathbb{Z}/8\mathbb{Z}$. Compute $\overline{2}\cdot\overline{4}$, $\overline{3}^{\,2}$, and $\overline{2}^{\,3}$. Which of $\overline{2},\overline{3},\overline{4}$ are units? Which are nilpotent?"></div></li><li class="qv-q" data-qid="groupset1-decide-whether-each-of-following-subring" id="groupset1-decide-whether-each-of-following-subring"><div class="qv-stmt" data-md="Decide whether each of the following is a subring of $\mathbb{Z}$:
$2\mathbb{Z}$, $\mathbb{Z}^{+}$, $\{0\}$, $6\mathbb{Z}+9\mathbb{Z}$, $\{n\in\mathbb{Z}\mid n\geq 10\}$."></div></li></ol></li><li class="qv-q" id="groupset1-determine-whether-each-of-following-statements"><div class="qv-stmt" data-md="Determine whether each of the following statements is true or false. Give a
short motivation or a counterexample."></div><ol class="qv-sublist" type="a"><li class="qv-q" data-qid="groupset1-rational-numbers-subring-of-real-numbers" id="groupset1-rational-numbers-subring-of-real-numbers"><div class="qv-stmt" data-md="The rational numbers $\mathbb{Q}$ are a subring of the real numbers $\mathbb{R}$."></div></li><li class="qv-q" data-qid="groupset1-ring-an-integral-domain" id="groupset1-ring-an-integral-domain"><div class="qv-stmt" data-md="The ring $\mathbb{Z}[x]$ is an integral domain."></div></li><li class="qv-q" data-qid="groupset1-set-of-all-polynomials-in-of" id="groupset1-set-of-all-polynomials-in-of"><div class="qv-stmt" data-md="The set of all polynomials in $\mathbb{R}[x]$ of degree at most $3$ is an ideal."></div></li><li class="qv-q" data-qid="groupset1-ring-factorial-unique-factorisation-domain" id="groupset1-ring-factorial-unique-factorisation-domain"><div class="qv-stmt" data-md="The ring $\mathbb{Z}/6\mathbb{Z}$ is factorial (i.e. a unique factorisation domain)."></div></li><li class="qv-q" data-qid="groupset1-gaussian-integers-2i-3i-associates-recall" id="groupset1-gaussian-integers-2i-3i-associates-recall"><div class="qv-stmt" data-md="The Gaussian integers $3-2i$ and $2+3i$ are associates. (Recall: $a$ and $b$ are *associates* if there exists a unit $u$ with $a=ub$.)"></div></li></ol></li><li class="qv-q" id="groupset1-let-be-rings-as-set-times"><div class="qv-stmt" data-md="Let $R_1,R_2$ be rings. As a set, $R_1\times R_2$ is just the Cartesian product of $R_1$ and $R_2$, i.e. $R_1\times R_2=\{(a,b)\mid a\in R_1,\ b\in R_2\}$."></div><ol class="qv-sublist" type="a"><li class="qv-q" data-qid="groupset1-define-addition-multiplication-on-times-making" id="groupset1-define-addition-multiplication-on-times-making"><div class="qv-stmt" data-md="Define addition and multiplication on $R_1\times R_2$ making it into a ring."></div></li><li class="qv-q" data-qid="groupset1-which-properties-being-commutative-unital-division" id="groupset1-which-properties-being-commutative-unital-division"><div class="qv-stmt" data-md="Which properties (being commutative, unital, a division ring, an integral domain) of a ring $R$ still hold for $R\times R$?"></div></li></ol></li><li class="qv-q" id="groupset1-simplify"><div class="qv-stmt" data-md="Simplify $n\mathbb{Z}/m\mathbb{Z}$."></div></li><li class="qv-q" id="groupset1-eisenstein-integers-elements-of-ring-omega"><div class="qv-stmt" data-md="Eisenstein integers are elements of the ring $\mathbb{Z}[\omega]$, $\omega=e^{\frac{2\pi i}{3}}$. Find all units in this ring."></div></li><li class="qv-q" id="groupset1-let-times-be-ring-of-all"><div class="qv-stmt" data-md="Let $M_{2\times 2}(\mathbb{R})$ be the ring of all real $2\times 2$ matrices."></div><ol class="qv-sublist" type="a"><li class="qv-q" data-qid="groupset1-show-times-not-commutative" id="groupset1-show-times-not-commutative"><div class="qv-stmt" data-md="Show that $M_{2\times 2}(\mathbb{R})$ is not commutative."></div></li><li class="qv-q" data-qid="groupset1-show-subset-subset-times-consisting-of" id="groupset1-show-subset-subset-times-consisting-of"><div class="qv-stmt" data-md="Show that the subset $S\subset M_{2\times 2}(\mathbb{R})$ consisting of all matrices of the form
$$\begin{pmatrix} x &amp; 0 \\ y &amp; x \end{pmatrix},\qquad x,y\in\mathbb{R},$$
is a subring of $M_{2\times 2}(\mathbb{R})$."></div></li><li class="qv-q" data-qid="groupset1-determine-whether-commutative" id="groupset1-determine-whether-commutative"><div class="qv-stmt" data-md="Determine whether $S$ is commutative."></div></li></ol></li><li class="qv-q" id="question"><div class="qv-stmt" data-md=""></div><ol class="qv-sublist" type="a"><li class="qv-q" data-qid="write-down-explicitly-all-elements-of" id="write-down-explicitly-all-elements-of"><div class="qv-stmt" data-md="Write down explicitly all the elements of $\mathbb{Z}_3[\phi]$ (don't resolve $\phi$ to $\frac 12(1+\sqrt{5})$ however)."></div></li><li class="qv-q" data-qid="prove-in-fact-field" id="prove-in-fact-field"><div class="qv-stmt" data-md="Prove that this is in fact a field."></div></li></ol></li><li class="qv-q" id="groupset1-show-there-exist-ring-homomorphisms-varphi"><div class="qv-stmt" data-md="Show that there exist ring homomorphisms
$\varphi_1,\varphi_2:\mathbb{Z}[i]\to\mathbb{Z}/101\mathbb{Z}$
such that $\varphi_1(i)=\overline{10}$ and $\varphi_2(i)=\overline{-10}$."></div></li></ol></div></details></section><section class="qvn-page" data-page="p2" hidden><div class="qvn-crumb">Ring Theory</div><details class="qv-sec" data-d="1" open id="grp-ringtheory-groupset2"><summary>Exercises before F3</summary><div class="qv-secbody"><div class="qv-gtext" data-md="Bar notation $\bar x$ below means the equivalence class."></div><ol class="qv-list"><li class="qv-q" id="groupset2-easy-prove-or-disprove-ring-hom-basics"><div class="qv-stmt" data-md="Let $\varphi:R\to S$ be a ring homomorphism between two non-zero unital rings. Assuming $\varphi$ is not the zero map itself, prove or disprove the following statements:"></div><ol class="qv-sublist" type="a"><li class="qv-q" data-qid="groupset2-easy-zero-maps-to-zero" id="groupset2-easy-zero-maps-to-zero"><div class="qv-stmt" data-md="$\varphi(0_R)=0_S$."></div></li><li class="qv-q" data-qid="groupset2-easy-identity-maps-to-identity" id="groupset2-easy-identity-maps-to-identity"><div class="qv-stmt" data-md="$\varphi(1_R)=1_S$."></div></li><li class="qv-q" data-qid="groupset2-easy-hom-is-injective" id="groupset2-easy-hom-is-injective"><div class="qv-stmt" data-md="$\varphi$ is injective if $R$ is a field."></div></li><li class="qv-q" data-qid="groupset2-easy-field-nonzero-hom-injective" id="groupset2-easy-field-nonzero-hom-injective"><div class="qv-stmt" data-md="If $\varphi$ is injective, then $R$ is a field."></div></li><li class="qv-q" data-qid="groupset2-easy-unit-maps-to-unit-when-identity-preserved" id="groupset2-easy-unit-maps-to-unit-when-identity-preserved"><div class="qv-stmt" data-md="If $u\in R$ is a unit, then $\varphi(u)$ is a unit."></div></li></ol></li><li class="qv-q" id="groupset2-easy-quotient-powers-x3-minus-2"><div class="qv-stmt" data-md="In $\mathbb{Z}[x]/\langle x^3-2x+1\rangle$, compute $\bar x^4$ and $\bar x^5$ (each in the form $a+b\bar x+c\bar x^2$)."></div></li><li class="qv-q" id="groupset2-easy-zero-divisors-z2-x2-plus-x"><div class="qv-stmt" data-md="List the four elements of $\mathbb{F}_2[x]/\langle x^2+x\rangle$. Compute $\bar x(\bar x+\bar 1)$ and use it to exhibit a pair of nonzero zero divisors in this ring."></div></li><li class="qv-q" id="groupset2-easy-complex-numbers-as-2x2-matrices"><div class="qv-stmt" data-md="Let $M:\mathbb{C}\to {\rm Mat_2}(\mathbb{R})$ be the map $a+bi\mapsto\mtwo a00a+b(n_x\sigma_x+n_y\sigma_y+n_z\sigma_z)$, where $n_x,n_y,n_z$ are real numbers and $\sigma_x,\sigma_y,\sigma_z$ are Pauli matrices. For which values of $(n_x,n_y,n_z)$ is this map a ring homomorphism? When is it injective?"></div></li><li class="qv-q" id="groupset2-easy-crt-15-as-3-times-5"><div class="qv-stmt" data-md="Chinese remainder theorem (CRT) establishes the isomorphism $\mathbb{Z}/15\mathbb{Z}\cong\mathbb{Z}/3\mathbb{Z}\times\mathbb{Z}/5\mathbb{Z}$. 

Find the image of $\overline 7$ under this isomorphism, and find the unique $x\in\{0,\dots,14\}$ whose image is $(2,3)$."></div></li><li class="qv-q" id="groupset2-medium-eval-hom-z-x-to-z-7-ideal-membership"><div class="qv-stmt" data-md="Define $\varphi:\mathbb{Z}[x]\to\mathbb{Z}/7\mathbb{Z}$ by $\varphi:P(x)\mapsto\overline{P(3)}$ (reduce mod 7 after evaluating a polynomial $P(x)$ at $3$). 

Find the kernel of the map."></div></li><li class="qv-q" id="groupset2-medium-localization-z-sixth"><div class="qv-stmt" data-md="Find all units in $\mathbb{Z}[1/6]$."></div></li><li class="qv-q" id="groupset2-medium-crt-solve-mod-9-mod-4"><div class="qv-stmt" data-md="Solve $x\equiv2\pmod 9$, $x\equiv5\pmod4$ by the Chinese Remainder Theorem: find integers $s,t$ with $9s+4t=1$, build the idempotents $e_1=4t\bmod36$ and $e_2=9s\bmod36$, check $e_1+e_2\equiv1\pmod{36}$, and combine them to give the solution $x\bmod 36$."></div></li><li class="qv-q" id="groupset2-medium-third-iso-theorem-z12-mod-4z12"><div class="qv-stmt" data-md="Let $R=\mathbb{Z}/12\mathbb{Z}$ and let $J/I=4\mathbb{Z}/12\mathbb{Z}=\{\bar0,\bar4,\bar8\}$, an ideal of $R$ (here $I=12\mathbb{Z}\subseteq J=4\mathbb{Z}$). List the four cosets of $R$ modulo this ideal explicitly, and match each one to the corresponding element of $\mathbb{Z}/4\mathbb{Z}$ under the Third Isomorphism Theorem $(R/I)/(J/I)\cong R/J$. Check that addition is respected on one example pair of cosets."></div></li><li class="qv-q" id="groupset2-hard-inverse-in-cubic-field-extended-euclid"><div class="qv-stmt" data-md="The polynomial $f(x)=x^3+x+1$ has no rational root, hence is irreducible over $\mathbb{Q}$. Therefore, $E=\mathbb{Q}[x]/\langle f(x)\rangle$ is a field. 

Explain the implications stated above (why hence? why therefore?). 

Write $\overline{x^2+1}^{\,-1}$ explicitly in $E$."></div></li><li class="qv-q" id="groupset2-hard-crt-idempotents-mod-60"><div class="qv-stmt" data-md="Let $R=\mathbb{Z}/60\mathbb{Z}\cong\mathbb{Z}/4\mathbb{Z}\times\mathbb{Z}/3\mathbb{Z}\times\mathbb{Z}/5\mathbb{Z}$ (via CRT, since $60=4\cdot3\cdot5$ with pairwise coprime factors)."></div><ol class="qv-sublist" type="a"><li class="qv-q" data-qid="groupset2-hard-crt-idempotents-mod-60-construct" id="groupset2-hard-crt-idempotents-mod-60-construct"><div class="qv-stmt" data-md="Construct the three idempotents $e_1,e_2,e_3\in R$ corresponding to $(1,0,0)$, $(0,1,0)$, $(0,0,1)$, and verify $e_1+e_2+e_3\equiv1$ and $e_ie_j\equiv0$ $(i\neq j)$, all mod 60."></div></li><li class="qv-q" data-qid="groupset2-hard-crt-idempotents-mod-60-solve" id="groupset2-hard-crt-idempotents-mod-60-solve"><div class="qv-stmt" data-md="Use the idempotents to solve $x\equiv3\pmod4$, $x\equiv1\pmod3$, $x\equiv4\pmod5$ for $x\bmod 60$."></div></li></ol></li><li class="qv-q" id="groupset2-hard-first-iso-theorem-z-x-eval-at-pm1-2"><div class="qv-stmt" data-md="Let $\varphi:\mathbb{Z}[x]\to\mathbb{Z}\times\mathbb{Z}$ be $p(x)\mapsto(p(1),p(-1))$. Find the kernel and the image of the map $\varphi$."></div></li><li class="qv-q" id="groupset2-hard-power-series-field-of-fractions-fibonacci"><div class="qv-stmt" data-md="The field of fractions of $\mathbb{Q}[[x]]$ is the field of formal Laurent series $\mathbb{Q}((x))$. Explain why $\dfrac1{1-x-x^2}$ actually lies in the subring $\mathbb{Q}[[x]]$ rather than needing genuine negative powers of $x$, then find its power series expansion $\sum c_nx^n$ up to the $x^4$ term by solving $(1-x-x^2)\big(\textstyle\sum c_nx^n\big)=1$ coefficient by coefficient. What well-known sequence are the $c_n$?"></div></li></ol></div></details></section></main>

function updatePager(pid){

  var prevA=document.getElementById('qvn-pager-prev'), nextA=document.getElementById('qvn-pager-next');
